name: Tests

# The release workflow in SiebeBaree/Notchlet pushes here with no review, so a
# bad bump would otherwise be found by whoever runs brew install next.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the casks
    runs-on: macos-26
    steps:
      # No actions/checkout on purpose. setup-homebrew clones this repo into
      # Homebrew's own taps directory at the commit under test, so brew reads
      # this commit rather than what is already on GitHub and a pull request is
      # audited before it lands. A checkout step here lands in the wrong
      # directory and then fights the action over that clone.
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c

      - name: brew style
        run: brew style siebebaree/tap

      # --online downloads the DMG, so this is what catches a sha256 that does
      # not match the release the url points at.
      - name: brew audit
        run: brew audit --cask --online --strict siebebaree/tap/notchlet
